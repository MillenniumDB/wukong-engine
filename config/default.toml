#################
# CONFIGURATION #
#################
# This is the default configuration file for the WUKONG engine.
# You can modify the values below to customize the execution of the tool.
# For more information, see: https://github.com/MillenniumDB/wukong-engine/blob/main/docs/configuration.md

##################
# PIPELINE STEPS #
##################
# Enable or disable each step in the pipeline (true/false)
[pipeline]

# This step is responsible for extracting entities from the documents
# Default: true
extract_entities = true

# This step is responsible for extracting relationships between entities from the documents
# Note: This step expects previously extracted entities to be available
# Default: true
extract_relationships = true

# This step is responsible for exporting the knowledge graph to various formats
# Note: This step expects previously extracted entities and relationships to be available
# Default: true
export_graph = true

##############
# PARAMETERS #
##############
# Customize different parameters
[parameters]

### List of formats for exporting the results ###
# You can choose from the following formats:
# "mdb": MillenniumDB Quad Model file
# "neo4j": Neo4j CSV files
# "json": JSON files
# Default: ["mdb", "neo4j", "json"]
export_formats = ["mdb", "neo4j", "json"]

### Maximum number of tokens for each document chunk ###
# This is used to control the size of the text processed by each LLM call
# Adjust this value based on the LLM's context window, API request/response size and your needs
# Default: 2000
max_tokens = 2000

### Maximum number of worker threads to use for API calls ###
# This controls the concurrency of API requests to the LLM
# Adjust this value based on your system's capabilities and the LLM's rate limits
# Default: 10
max_worker_threads = 10

##############
#    LLM     #
##############
# Configuration for the Large Language Model (LLM) used in the pipeline
[llm]

# The LLM model to use for processing
# Note: Currently only OpenAI models are supported
# Default: "gpt-4.1-mini"
model = "gpt-4.1-mini"

# Whether to accept only strictly supported models or to allow any model
# Note: Setting this to true will raise an error if an unsupported model is specified
# Note: Setting this to false will allow any model but will log a warning if it's not in the supported list
# Default: true
strict = true
