#################
# CONFIGURATION #
#################
# This is the default configuration file for the WUKONG engine.
# You can modify the values below to customize the execution of the tool.
# For more information, see: https://github.com/MillenniumDB/wukong-engine/blob/main/docs/configuration.md

##############
#  PIPELINE  #
##############
# This section controls which steps of the engine pipeline are executed
[pipeline]

### Ingest documents into the system ###
# Note: Expects input documents to be available as specified in the workspace document collections
# Default: true
ingest_documents = true

### Extract entities from the documents ###
# Note: Expects input documents to be already ingested into the system
# Default: true
extract_entities = true

### Extract relationships between entities from the documents ###
# Note: Expects input documents to be already ingested and previously extracted entities to be available
# Default: true
extract_relationships = true

### Export the extracted knowledge ###
# Note: Expects previously extracted entities and relationships to be available
# Default: true
export_knowledge = true

##############
#    LLM     #
##############
# This section controls the configuration of the LLM used for knowledge extraction
[llm]

### The LLM model to use for extraction ###
# Note: Currently only OpenAI models are supported
# Supported models:
# "gpt-4.1-mini": Best non-reasoning, cheapest
# "gpt-5-mini": Most balanced
# "gpt-5.4-mini": Best reasoning, more expensive
# Default: "gpt-4.1-mini"
model = "gpt-4.1-mini"

### Execution mode for LLM interactions ###
# You can choose from the following modes:
# "real-time": Real-time execution using concurrent API calls (faster, but more expensive)
# "batch": Asynchronous execution using external batch API processing (slower, but more cost-effective)
# Default: "real-time"
execution_mode = "real-time"

### Maximum concurrency for LLM API calls ###
# Note: Adjust this value based on the LLM provider's rate limits
# Reference values to consider based on OpenAI usage tiers (for mini models):
# - Tier 1: 1
# - Tier 2: 8
# - Tier 3: 15 (default)
# - Tier 4: 35
# - Tier 5: 500
# Default: 15
max_concurrency = 15

##############
#  CHUNKING  #
##############
# This section controls the configuration of the document chunking process
# Note: Adjust these settings based on desired granularity vs cost trade-off, the LLM's context window, API request/response size limits
[chunking]

### Ideal number of tokens for each chunk ###
# Note: This value should be in the range [1, 5000], with the recommended range being [100, 2000]
# Default: 800
target_tokens = 800

### Number of overlapping tokens between consecutive chunks ###
# Note: This value should be in the range [0, target_tokens - 1] (a good default is 0.15 * target_tokens)
# Default: 120
overlap_tokens = 120

##############
#   EXPORT   #
##############
# This section controls the configuration of the export process for the extracted knowledge
[export]

### Format for exporting the results ###
# You can choose from the following formats:
# "json": Generic graph-formatted JSON files
# "mdb": MillenniumDB graph database QM (Quad Model) file
# "neo4j": Neo4j graph database CSV files
# Default: "json"
format = "json"
