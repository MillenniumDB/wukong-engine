#################
# CONFIGURATION #
#################
# This is the configuration file for the WUKONG Engine.
# You can modify the values below to customize the execution of the tool.
# For more information, refer to the documentation.

##################
# PIPELINE STEPS #
##################
[pipeline]
# Enable or disable each step in the pipeline (true/false)

# This step is responsible for processing the plain text files
# Note: This step requires the original plain text documents to be available
# Note: Only skip this step if you have already completed it at least once
document_processing = false

# This step is responsible for extracting entities from the processed documents
# Note: This step requires the processed documents to be available
entity_extraction = false

# This step is responsible for extracting relations between entities from the processed documents
# Note: This step requires the extracted entities to be available
relation_extraction = false

# This step is responsible for exporting the knowledge graph to various formats
# Note: This step requires the extracted entities and relations to be available
export_graph = false

##############
# PARAMETERS #
##############
[parameters]
# Customize different parameters

# List of formats for exporting the results
# You can choose from the following formats:
# "mdb": MillenniumDB Quad Model file
# "neo4j": Neo4j CSV files
# "json": JSON files
# Default: ["mdb", "neo4j", "json"]
export_formats = ["mdb", "neo4j", "json"]

# Maximum number of tokens for each document chunk
# This is used to control the size of the text processed by each LLM call
# Adjust this value based on the LLM's context window size and your needs
# Default: 2000
max_tokens = 2000

# Maximum number of worker threads to use for API calls
# This controls the concurrency of API requests to the LLM
# Adjust this value based on your system's capabilities and the LLM's rate limits
# Default: 10
max_worker_threads = 10
